        for (const filename of files) {
          const block = document.createElement("div");
          block.className = "story-block";

          /* -------------------------
         IMAGE (JPG / PNG)
      ------------------------- */
          if (filename.match(/\.(jpg|jpeg|png)$/i)) {
            // PANORAMA
            if (filename.toLowerCase().includes("pano")) {
              block.classList.add("pano"); // <-- THIS is the missing piece
              const kb = document.createElement("div");
              kb.className = "kb-container";

              const img1 = document.createElement("img");
              img1.className = "kb-pano";
              img1.src = filename;

              const img2 = document.createElement("img");
              img2.className = "kb-pano";
              img2.src = filename;

              kb.appendChild(img1);
              kb.appendChild(img2);

              block.appendChild(kb);
            } else {
              // NORMAL PHOTO
              const img = document.createElement("img");
              img.src = filename;
              block.appendChild(img);
            }
          } else if (filename.match(/\.mp4$/i)) {
            /* -------------------------
         VIDEO (MP4)
      ------------------------- */
            const vid = document.createElement("video");
            vid.src = filename;
            vid.controls = true;
            block.appendChild(vid);
          } else if (filename.match(/\.mp3$/i)) {
            /* -------------------------
         AUDIO (MP3)
      ------------------------- */
            const aud = document.createElement("audio");
            aud.src = filename;
            aud.controls = true;
            block.appendChild(aud);
          }

          /* -------------------------
         CAPTION
      ------------------------- */
          const captionName = filename.replace(
            /\.(jpg|jpeg|png|mp4|mp3)$/i,
            ".txt",
          );

          try {
            const capResp = await fetch(captionName);
            if (capResp.ok) {
              const captionText = await capResp.text();
              const caption = document.createElement("div");
              caption.className = "caption";
              caption.textContent = captionText;
              block.appendChild(caption);
            }
          } catch {}

          container.appendChild(block);
        }
